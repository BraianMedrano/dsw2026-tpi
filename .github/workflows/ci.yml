name: CI

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Dsw2026Tpi.slnx

      - name: Build solution
        run: dotnet build Dsw2026Tpi.slnx --no-restore

      - name: Run tests
        run: dotnet test Dsw2026Tpi.slnx --no-build
